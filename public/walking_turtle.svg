<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 20 280 200" role="img" aria-label="左向きに歩く黒っぽいカメのピクトグラム">
  <style>
    .body { fill: #25282a; }
    .shell-line { fill: none; stroke: #3a3e40; stroke-width: 8; stroke-linecap: round; opacity: .8; }
    .head { animation: head-bob .65s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 90% 70%; }
    .leg-a { animation: leg-a .65s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 15%; }
    .leg-b { animation: leg-b .65s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 15%; }
    .tail { fill: #25282a; }
    @keyframes head-bob {
      from { transform: rotate(-4deg) translateY(1px); }
      to   { transform: rotate(5deg) translateY(-4px); }
    }
    @keyframes leg-a {
      from { transform: rotate(-16deg) translateY(0); }
      to   { transform: rotate(16deg) translateY(3px); }
    }
    @keyframes leg-b {
      from { transform: rotate(16deg) translateY(3px); }
      to   { transform: rotate(-16deg) translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .head, .leg-a, .leg-b { animation: none; }
    }
  </style>

  <g class="turtle" transform="translate(0 25)">
    <!-- tail -->
    <path class="tail" d="M260 108 L292 94 L282 124 Z"/>

    <!-- rear legs -->
    <g class="leg-a">
      <path class="body" d="M235 135 C218 150 210 178 220 190 C232 199 250 178 260 151 C263 143 252 133 235 135 Z"/>
    </g>
    <g class="leg-b">
      <path class="body" d="M118 139 C102 154 94 181 105 192 C118 200 134 179 144 153 C147 144 136 136 118 139 Z"/>
    </g>

    <!-- shell -->
    <path class="body" d="M105 132 C103 72 143 35 205 36 C263 37 300 75 296 132 C269 145 132 146 105 132 Z"/>
    <path class="shell-line" d="M126 111 C145 79 170 61 204 59 C239 61 265 79 280 111"/>
    <path class="shell-line" d="M161 48 C169 76 169 104 160 137"/>
    <path class="shell-line" d="M244 48 C236 76 236 104 245 137"/>

    <!-- front legs -->
    <g class="leg-b">
      <path class="body" d="M86 132 C68 144 56 169 63 183 C73 194 94 176 107 151 C112 141 103 130 86 132 Z"/>
    </g>
    <g class="leg-a">
      <path class="body" d="M274 132 C290 144 300 168 293 181 C282 191 263 174 251 150 C246 140 256 130 274 132 Z"/>
    </g>

    <!-- neck + head, facing left -->
    <g class="head">
      <path class="body" d="M112 103 C91 93 72 91 57 98 C41 106 34 121 41 135 C49 150 69 153 84 144 C96 137 104 128 119 126 Z"/>
      <circle cx="58" cy="118" r="4.5" fill="#f4f4f1"/>
    </g>
  </g>
</svg>
